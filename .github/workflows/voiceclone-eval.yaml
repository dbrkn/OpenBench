name: VoiceClone Eval

# Mirrors tests.yaml (format + tests) and adds a dataset-validation job for
# argmaxinc/voiceclone-eval (registered as `voiceclone-eval` / `voiceclone-eval-mini`).
#
# The full voice-clone generation eval (WER + SIM) needs the ArgmaxPrototypes
# `tts-cli` (MLX / Apple Silicon) and therefore runs locally, not on hosted CI:
#
#   uv run openbench-cli evaluate \
#     --pipeline argmax-speech-generation-prototype \
#     --dataset voiceclone-eval \
#     -m wer -m sim \
#     --pipeline-config cli_path=/path/to/ArgmaxPrototypes/.venv/bin/tts-cli

on:
  workflow_dispatch:
    inputs:
      dataset:
        description: "Dataset alias to validate"
        type: choice
        options:
          - voiceclone-eval-mini
          - voiceclone-eval
        default: voiceclone-eval-mini
  push:
    branches:
      - berkin/voiceclone-eval

jobs:
  check-format:
    name: Check Format
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run Ruff linter
      uses: astral-sh/ruff-action@v3
      with:
        args: "check --output-format github src/"

    - name: Run Ruff formatter
      run: ruff format --check --diff src/

  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.3"
        enable-cache: true

    - name: Login to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      shell: bash -e {0}
      run: |
        uv run huggingface-cli login --token "$HF_TOKEN" > /dev/null 2>&1

    - name: Run tests
      shell: bash -e {0}
      run: |
        make test
      continue-on-error: false

  validate-voiceclone-dataset:
    name: Validate voiceclone-eval dataset
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup uv
      uses: astral-sh/setup-uv@v6
      with:
        version: "0.8.3"
        enable-cache: true

    - name: Login to Hugging Face
      env:
        HF_TOKEN: ${{ secrets.HF_TOKEN }}
      shell: bash -e {0}
      run: |
        uv run huggingface-cli login --token "$HF_TOKEN" > /dev/null 2>&1

    - name: Validate dataset registration
      shell: bash -e {0}
      run: |
        uv run python scripts/voiceclone/validate_dataset.py --dataset "${{ github.event.inputs.dataset || 'voiceclone-eval-mini' }}"
